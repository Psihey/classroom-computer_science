<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конструктор місій — гра з робототехніки</title>
<script>
(function(){var t=null;try{t=localStorage.getItem('vexTheme');}catch(e){}
if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  --bg:#f4f7fb; --card:#fff; --text:#172033; --muted:#5d687c;
  --blue:#1976d2; --blue-soft:#eaf3ff; --red:#d83b3b; --red-soft:#fff0f0;
  --green:#198754; --green-soft:#edf9f2; --yellow:#f2b705; --yellow-soft:#fff9df;
  --border:#dce3ed; --purple:#7b4bc4; --purple-soft:#f4eeff;
  --th:#eef2f7; --tile:#fff; --vis:#f9fafc; --link:#0d5bd7;
  --shadow:0 5px 18px rgba(30,50,80,.06);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1520; --card:#18202e; --text:#e6ecf5; --muted:#9aa6b8;
  --blue:#4f9cf0; --blue-soft:#14253c; --red:#f06b6b; --red-soft:#331b1e;
  --green:#3fbf7f; --green-soft:#12291e; --yellow:#f2c230; --yellow-soft:#2c2614;
  --border:#2b3647; --purple:#a983ec; --purple-soft:#231a37;
  --th:#1f2938; --tile:#1d2636; --vis:#121925; --link:#7db4ff;
  --shadow:0 5px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1520; --card:#18202e; --text:#e6ecf5; --muted:#9aa6b8;
    --blue:#4f9cf0; --blue-soft:#14253c; --red:#f06b6b; --red-soft:#331b1e;
    --green:#3fbf7f; --green-soft:#12291e; --yellow:#f2c230; --yellow-soft:#2c2614;
    --border:#2b3647; --purple:#a983ec; --purple-soft:#231a37;
    --th:#1f2938; --tile:#1d2636; --vis:#121925; --link:#7db4ff;
    --shadow:0 5px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:110px}
.wrap{max-width:1100px;margin:auto;padding:0 18px}
header{background:linear-gradient(135deg,#0d47a1,#1976d2);color:#fff;padding:16px 0}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-right:60px}
.logo{font-size:24px;font-weight:800;margin-right:auto}
.stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:999px;font-weight:700;white-space:nowrap}
.hbtn{background:#fff;color:#0d47a1;border:0;border-radius:999px;padding:8px 14px;font:700 15px Segoe UI,Arial,sans-serif;cursor:pointer}
.theme-btn{position:fixed;top:12px;right:12px;z-index:60;border:1px solid var(--border);background:var(--card);color:var(--text);width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:0 6px 20px rgba(20,40,80,.18)}
h1{font-size:clamp(26px,4vw,38px);margin:0 0 8px}
h2{font-size:24px;margin:0 0 10px}
h3{font-size:19px;margin:18px 0 8px}
section{margin:20px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.notice{border-left:6px solid var(--yellow);background:var(--yellow-soft)}
.blue{border-left:6px solid var(--blue);background:var(--blue-soft)}
.green{border-left:6px solid var(--green);background:var(--green-soft)}
.red{border-left:6px solid var(--red);background:var(--red-soft)}
.purple{border-left:6px solid var(--purple);background:var(--purple-soft)}
.small{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font:700 17px Segoe UI,Arial,sans-serif;cursor:pointer;background:var(--blue);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--border)}
.btn.green{background:var(--green);border:0}
.btn.purple{background:var(--purple)}
input[type=text]{font:600 18px Segoe UI,Arial,sans-serif;padding:12px 14px;border-radius:12px;border:2px solid var(--border);background:var(--tile);color:var(--text);width:100%;max-width:420px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mcard{background:var(--tile);border:2px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;position:relative;transition:transform .12s,border-color .12s}
.mcard:hover:not(.locked){transform:translateY(-2px);border-color:var(--blue)}
.mcard.locked{opacity:.5;cursor:not-allowed}
.mcard.bonus{border-style:dashed;border-color:var(--purple)}
.mcard .mi{font-size:40px;line-height:1}
.mcard .mt{font-weight:800;font-size:18px;margin:6px 0 2px}
.mcard .ms{font-size:22px;letter-spacing:2px;color:#f2b705}
.mcard .mnum{position:absolute;top:12px;right:14px;font-weight:800;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{background:var(--tile);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:15px}
.chip b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.part{background:var(--tile);border:2px solid var(--border);border-radius:14px;padding:12px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:border-color .1s,background .1s}
.part:hover{border-color:var(--blue)}
.part.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 2px var(--blue) inset}
.part .ptop{display:flex;align-items:center;gap:8px}
.part .pi{font-size:28px;line-height:1}
.part .pn{font-weight:800;font-size:16px;line-height:1.2}
.part .pm{font-size:13px;font-weight:700;color:var(--muted)}
.part .pd{font-size:13px;color:var(--muted);line-height:1.35}
.gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gh .small{margin:0}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -6px 20px rgba(20,40,80,.12);z-index:40}
.dock .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 18px}
.meter{font-weight:800;font-size:17px}
.meter.over{color:var(--red)}
.dock .grow{margin-right:auto}
canvas{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--border)}
.log{font-family:Consolas,monospace;font-size:15px;background:#202733;color:#e6ecf5;border-radius:12px;padding:12px 14px;min-height:150px;margin-top:12px}
.log div{margin:3px 0;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.bar{background:var(--tile);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.bar .bl{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.bar .bt{height:10px;border-radius:99px;background:var(--th);margin-top:6px;overflow:hidden}
.bar .bf{height:100%;border-radius:99px}
.bigstars{font-size:46px;letter-spacing:6px;color:#f2b705;line-height:1}
.res{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.res .num{font-size:38px;font-weight:800;color:var(--blue);line-height:1}
.expl{list-style:none;padding:0;margin:10px 0}
.expl li{padding:9px 12px;border-radius:10px;margin:6px 0;border:1px solid var(--border);background:var(--tile)}
.expl li.ok{border-left:6px solid var(--green)}
.expl li.warn{border-left:6px solid var(--yellow)}
.expl li.bad{border-left:6px solid var(--red)}
.code{font:800 clamp(30px,6vw,52px) Consolas,monospace;letter-spacing:4px;background:#202733;color:#7df0b0;border-radius:14px;padding:16px 22px;display:inline-block}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid var(--border);padding:8px 10px;text-align:left}
th{background:var(--th)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.flow div{background:var(--tile);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;font-weight:700}
/* ---- програмування ---- */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media(max-width:900px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.pal button{border:0;border-radius:8px;padding:8px 12px;font:600 14px Segoe UI,Arial,sans-serif;color:#fff;cursor:pointer;text-shadow:0 1px 1px rgba(0,0,0,.25);text-align:left;line-height:1.2}
.pal button small{display:block;font-weight:400;font-size:12px;opacity:.9}
.pal button:hover{filter:brightness(1.08)}
.k-drive{background:#4c97ff}.k-ctrl{background:#ffab19}.k-my{background:#ff6680}
.ws{background:var(--th);border:1px solid var(--border);border-radius:12px;padding:12px;min-height:200px;font:600 15px Segoe UI,Arial,sans-serif;color:#fff}
.hat{display:inline-block;background:#ffbf00;border-radius:20px 20px 6px 6px;padding:10px 14px 6px;margin-bottom:2px;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.slot{min-height:34px;padding:3px 0 3px 0;border-radius:6px;cursor:pointer}
.slot.tgt{outline:3px dashed var(--blue);outline-offset:2px;background:rgba(25,118,210,.07)}
.slot .empty{color:var(--muted);font-weight:600;font-size:13px;padding:7px 10px}
.pb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px 6px 12px;border-radius:6px;margin:3px 0;min-height:36px;text-shadow:0 1px 1px rgba(0,0,0,.25);width:max-content;max-width:100%}
.pc{margin:3px 0;width:max-content;max-width:100%}
.pc>.ph{background:#ffab19;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px 6px 12px;border-radius:8px 8px 0 0;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.pc>.ph.mid{border-radius:0}
.pc>.pbody{border-left:16px solid #ffab19;padding:2px 6px 2px 6px;min-width:190px}
.pc>.pf{background:#ffab19;height:14px;border-radius:0 0 8px 8px;width:120px}
.ctl{display:inline-flex;gap:2px;margin-left:6px}
.ctl button{border:0;background:rgba(0,0,0,.22);color:#fff;border-radius:5px;width:24px;height:24px;cursor:pointer;font-size:13px;padding:0}
.ctl button:hover{background:rgba(0,0,0,.4)}
.pnum{width:52px;font:700 14px Segoe UI,Arial,sans-serif;border-radius:999px;border:0;padding:3px 8px;text-align:center}
.pcond{font:600 14px Segoe UI,Arial,sans-serif;border-radius:999px;border:0;padding:4px 8px;background:#5cb1d6;color:#fff;max-width:260px}
.pcond option{color:#172033;background:#fff}
.sens{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sens span{border-radius:10px;padding:6px 10px;font-size:14px;border:1px solid var(--border);background:var(--tile)}
.sens span.on{border-color:var(--green)}.sens span.off{opacity:.75;border-style:dashed}
.status{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--tile);font-weight:600}
.status.ok{border-left:6px solid var(--green)}.status.bad{border-left:6px solid var(--red)}.status.info{border-left:6px solid var(--blue)}
.mrow{display:flex;gap:14px;font-size:15px;margin-top:4px;flex-wrap:wrap}
.tag2{display:inline-block;background:var(--purple);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:middle}
@media(max-width:650px){.card{padding:16px}.hrow{padding-right:50px}}
</style>
</head>

function findPart(group,id){var a=PARTS[group];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function buildCost(b){
 var c=0,p;
 if(b.chassis)c+=findPart('chassis',b.chassis).cost;
 b.sensors.forEach(function(s){c+=findPart('sensors',s).cost;});
 if(b.power)c+=findPart('power',b.power).cost;
 if(b.control)c+=findPart('control',b.control).cost;
 return c;
}
function buildWeight(b){
 var w=0,load=0;
 b.sensors.forEach(function(s){load+=findPart('sensors',s).w;});
 if(b.power)load+=findPart('power',b.power).w;
 if(b.chassis)w=findPart('chassis',b.chassis).w;
 return {total:w+load,load:load};
}
function pick(map,key,b){
 if(typeof map==='function')return map(b);
 return map[key]||[0.2,'Не найкращий вибір для цієї місії.'];
}
function evaluate(m,b){
 var lines=[],crit=false;
 function add(f,msg,isCrit){lines.push({t:f>=0.85?'ok':(f>=0.4?'warn':'bad'),msg:msg});if(isCrit)crit=true;}
 var ch=pick(m.chassis,b.chassis,b),c=ch[0];add(c,'Шасі: '+ch[1],c===0);
 var tot=0,sum=0,used={};
 m.sensors.forEach(function(r){
  tot+=r.w;var q=0;
  b.sensors.forEach(function(s){var v=r.opts[s]||0;if(v>0)used[s]=1;if(v>q)q=v;});
  sum+=r.w*q;
  if(q>=0.85)lines.push({t:'ok',msg:r.name+': '+r.good});
  else if(q>0)lines.push({t:'warn',msg:r.name+': '+(r.part||'справляється лише частково — для цього є кращий датчик.')});
  else{lines.push({t:'bad',msg:r.name+': '+r.bad});if(r.crit)crit=true;}
 });
 var pen=0;
 b.sensors.forEach(function(s){
  if(used[s])return;var p=findPart('sensors',s);
  if(m.useless[s]){pen+=0.08;lines.push({t:'bad',msg:p.name+' — зайвий: '+m.useless[s]});}
  else{pen+=0.04;lines.push({t:'warn',msg:p.name+' у цій місії не знадобився — гроші витрачено даремно.'});}
 });
 var s=Math.max(0,Math.min(1,(tot?sum/tot:1)-pen));
 var pw=pick(m.power,b.power,b),p=pw[0];add(p,'Живлення: '+pw[1],p===0);
 var ct=pick(m.control,b.control,b),k=ct[0];add(k,'Керування: '+ct[1],k===0);
 var wt=buildWeight(b),chp=findPart('chassis',b.chassis);
 if(chp.maxLoad&&wt.load>chp.maxLoad+1e-9){crit=true;lines.push({t:'bad',msg:'Вантаж: дрон не злетить! Датчики й живлення важать '+fmt(wt.load)+' ⚖️, а дрон піднімає лише '+chp.maxLoad+' ⚖️.'});}
 if(m.weightLimit&&wt.total>m.weightLimit+1e-9){crit=true;lines.push({t:'bad',msg:'Вага: робот важить '+fmt(wt.total)+' ⚖️, а дозволено '+m.weightLimit+' ⚖️ — міна може спрацювати під ним!'});}
 var score=Math.round(100*(0.4*c+0.3*s+0.15*p+0.15*k));
 if(crit)score=Math.min(score,30);
 var success=!crit&&score>=40;
 var stars=success?(score>=85?3:(score>=65?2:1)):0;
 return {c:c,s:s,p:p,k:k,score:score,crit:crit,success:success,stars:stars,lines:lines,leftover:m.budget-buildCost(b)};
}

function condAvail(c,sensors){return CONDS[c].needs.some(function(s){return sensors.indexOf(s)>=0;});}
function countBlocks(arr){var n=0;(arr||[]).forEach(function(b){n++;if(b.body)n+=countBlocks(b.body);if(b.els)n+=countBlocks(b.els);});return n;}
var DX=[0,1,0,-1],DY=[-1,0,1,0];
/* виконання програми на одній карті; повертає слід кроків і результат */
function runProgram(code,map,sensors,useGyro){
 var g=map.grid,H=g.length,W=g[0].length;
 var st={x:map.start[0],y:map.start[1],d:map.start[2],turns:0,marks:{},steps:0,drift:false};
 var trace=[snap()],err=null;
 function snap(ev){return {x:st.x,y:st.y,d:st.d,marks:Object.assign({},st.marks),ev:ev||null};}
 function cell(x,y){if(x<0||y<0||x>=W||y>=H)return '#';return g[y][x];}
 function cond(c){
  if(!c)throw {k:'nocond'};
  if(!condAvail(c,sensors))throw {k:'locked',c:c};
  if(c==='red')return cell(st.x,st.y)==='R';
  if(c==='wall')return cell(st.x+DX[st.d],st.y+DY[st.d])==='#';
  if(c==='metal')return cell(st.x,st.y)==='M';
  return false;
 }
 function tick(){if(++st.steps>400)throw {k:'limit'};}
 function exec(list){
  for(var i=0;i<list.length;i++){
   var b=list[i];
   if(b.t==='fwd'){tick();var nx=st.x+DX[st.d],ny=st.y+DY[st.d];if(cell(nx,ny)==='#'){trace.push(snap('crash'));throw {k:'crash',step:st.steps};}st.x=nx;st.y=ny;trace.push(snap());}
   else if(b.t==='right'||b.t==='left'){tick();st.turns++;var q=b.t==='right'?1:3;
    if(useGyro&&st.turns>=3&&st.turns%2===1){q=2;st.drift=true;}
    st.d=(st.d+q)%4;trace.push(snap(q===2?'drift':null));}
   else if(b.t==='mark'){tick();st.marks[st.x+','+st.y]=1;trace.push(snap('mark'));}
   else if(b.t==='repeat'){var n=Math.max(1,Math.min(50,parseInt(b.n,10)||1));for(var k=0;k<n;k++)exec(b.body);}
   else if(b.t==='until'){var guard=0;while(!cond(b.c)){tick();exec(b.body);if(++guard>400)throw {k:'limit'};}}
   else if(b.t==='if'){if(cond(b.c))exec(b.body);}
   else if(b.t==='ifelse'){if(cond(b.c))exec(b.body);else exec(b.els);}
  }
 }
 try{if(!code.length)throw {k:'empty'};exec(code);}catch(e){if(e&&e.k)err=e;else throw e;}
 var ok=false,why='';
 if(err){
  why=err.k==='crash'?'💥 Робот врізався в стіну.':err.k==='limit'?'🔁 Програма не закінчилася за 400 кроків — робот кружляє на місці.':err.k==='empty'?'Програма порожня.':err.k==='nocond'?'В одному з блоків if / repeat until не вибрано умову.':'Умова «'+CONDS[err.c].uk+'» недоступна: на роботі немає датчика ('+CONDS[err.c].why+').';
 }else if(map.goal==='mines'||g.join('').indexOf('M')>=0){
  var want=[],extra=0,miss=0;
  for(var y=0;y<H;y++)for(var x=0;x<W;x++)if(g[y][x]==='M')want.push(x+','+y);
  want.forEach(function(k){if(!st.marks[k])miss++;});
  Object.keys(st.marks).forEach(function(k){if(want.indexOf(k)<0)extra++;});
  ok=!miss&&!extra;
  why=ok?'✅ Усі міни позначено.':(miss?'❌ Пропущено мін: '+miss+'. ':'')+(extra?'❌ Зайвих позначок: '+extra+' (там немає міни).':'');
 }else{
  ok=cell(st.x,st.y)==='R';
  why=ok?'✅ Робот на червоній клітинці!':'❌ Програма закінчилася, але робот не на червоній клітинці.';
 }
 if(st.drift&&!ok)why+=' Без гіроскопа робот не знає точно, на скільки повернув: похибка накопичилась, і з 3-го повороту деякі повороти виходять на 180° — робот їде не туди.';
 return {ok:ok,why:why,trace:trace,drift:st.drift};
}

var ALPH='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
var P34=17179869184; /* 2^34 */
function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return h>>>0;}
function normName(n){return String(n).toLowerCase().replace(/[’'ʼ`\s.\-_,]/g,'');}
function codeMask(chk){return fnv('a'+chk)*4+(fnv('b'+chk)&3);}
/* vals: 7 зірок конструктора + 3 зірки програмування */
function makeCode(name,vals,points){
 var data=0;for(var i=0;i<10;i++)data+=(vals[i]&3)*Math.pow(4,i);
 data+=Math.min(points,16383)*1048576;
 var chk=fnv(normName(name)+'|'+data+'|r9l9v2')&0xFFF;
 var val=((data+codeMask(chk))%P34)*4096+chk,out='';
 for(var j=0;j<10;j++){out=ALPH[val%32]+out;val=Math.floor(val/32);}
 return out.slice(0,5)+'-'+out.slice(5);
}
function readCode(name,code){
 code=String(code).toUpperCase().replace(/[^0-9A-Z]/g,'');
 if(code.length!==10)return null;
 var val=0;for(var i=0;i<10;i++){var d=ALPH.indexOf(code[i]);if(d<0)return null;val=val*32+d;}
 var chk=val%4096,scr=Math.floor(val/4096);
 var data=((scr-codeMask(chk))%P34+P34)%P34;
 if((fnv(normName(name)+'|'+data+'|r9l9v2')&0xFFF)!==chk)return null;
 var vals=[];for(var j=0;j<10;j++)vals.push(Math.floor(data/Math.pow(4,j))%4);
 return {build:vals.slice(0,7),prog:vals.slice(7),points:Math.floor(data/1048576)};
}
var MAX_STARS=27;
function gradeOf(s){return s<=0?1:Math.max(1,Math.round(s*12/MAX_STARS));}
function rankTitle(p){return p>=8000?'Головний конструктор':p>=6000?'Головний інженер':p>=4000?'Інженер':p>=2000?'Технік':'Стажер';}

 function group(key,title,hint,multi){
  var sec=h('section','card');
  sec.innerHTML='<div class="gh"><h2>'+title+'</h2><p class="small">'+hint+'</p></div>';
  var grid=h('div','parts');
  PARTS[key].forEach(function(p){
   var b=h('button','part');b.type='button';
   var meta='🪙 '+p.cost+(key==='control'?'':' · ⚖️ '+fmt(p.w));
   b.innerHTML='<div class="ptop"><span class="pi">'+p.icon+'</span><span class="pn">'+p.name+'</span></div><div class="pm">'+meta+'</div><div class="pd">'+p.d+'</div>';
   function sync(){var on=multi?build.sensors.indexOf(p.id)>=0:build[key]===p.id;b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on);}
   b.onclick=function(){
    if(multi){var ix=build.sensors.indexOf(p.id);if(ix>=0)build.sensors.splice(ix,1);else if(build.sensors.length<MAX_SENSORS)build.sensors.push(p.id);}
    else build[key]=p.id;
    [].forEach.call(grid.children,function(x){x._sync();});renderDock();
   };
   b._sync=sync;sync();grid.appendChild(b);

 function renderDock(){
  var st=mstate(cur.id),att=st.att+1,cap=att===1?3:att===2?2:1;

  var missing=[];if(!build.chassis)missing.push('шасі');if(!build.sensors.length)missing.push('датчики');if(!build.power)missing.push('живлення');if(!build.control)missing.push('керування');
  dock.innerHTML='<div class="wrap"><span class="meter'+(over?' over':'')+'">🪙 '+cost+' / '+cur.budget+'</span><span class="meter">'+wtxt+'</span><span class="meter">📡 '+build.sensors.length+' / '+MAX_SENSORS+'</span>'+

 /* ---------- симуляція ---------- */
 function launch(){
  var st=mstate(cur.id);st.att++;
  var r=evaluate(cur,build);
  var cap=st.att===1?3:st.att===2?2:1,mult=st.att===1?1:st.att===2?0.8:0.6;
  r.attStars=Math.min(r.stars,cap);
  r.points=r.success?Math.round(r.score*10*mult)+Math.max(0,r.leftover)*25:Math.round(r.score*2*mult);
  r.att=st.att;r.cap=cap;
  r.newBest=r.points>st.pts;
  st.stars=Math.max(st.stars,r.attStars);st.pts=Math.max(st.pts,r.points);
  st.last=JSON.parse(JSON.stringify(build));if(r.success)st.pass=JSON.parse(JSON.stringify(build));save();
  noDock();header();window.scrollTo(0,0);
  app.innerHTML='';
  var sec=h('section','card');
  sec.innerHTML='<h2>🎬 Симуляція: '+cur.icon+' '+cur.title+'</h2>';
  var cv=h('canvas');cv.width=1000;cv.height=320;sec.appendChild(cv);
  var log=h('div','log');sec.appendChild(log);
  var skip=h('button','btn ghost','Пропустити ⏩');skip.style.marginTop='12px';sec.appendChild(skip);
  app.appendChild(sec);
  var done=false;
  function finish(){if(done)return;done=true;stop();showResult(r);}
  skip.onclick=finish;
  var stop=animate(cv,cur,build,r,log,finish);
 }

 function animate(cv,m,b,r,log,onEnd){
  var ctx=cv.getContext('2d'),W=cv.width,H=cv.height,t0=performance.now(),DUR=5200,raf;
  var prog=r.success?1:Math.max(0.18,Math.min(0.6,r.score/100*0.9));
  var steps=r.lines.slice(),shown=0;
  var start=['00:00 ▶ Запуск місії «'+m.title+'»'];
  log.innerHTML='<div>'+esc(start[0])+'</div>';
  function frame(now){
   var t=Math.min(1,(now-t0)/DUR);
   var mv=Math.min(1,t/0.85);var e=mv<0.5?2*mv*mv:1-Math.pow(-2*mv+2,2)/2;
   var x=60+(W-160)*prog*e;
   var stuck=!r.success&&mv>=1;
   if(stuck)x+=Math.sin(now/40)*3;
   drawScene(ctx,W,H,m.theme,now);
   drawRobot(ctx,x,m,b,now,stuck);
   if(stuck){ctx.font='bold 34px Segoe UI, sans-serif';ctx.textAlign='center';ctx.fillText('💥',x,groundY(H,m,b)-95);}
   if(t>=0.97){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,H/2-38,W,76);
    ctx.fillStyle=r.success?'#7df0b0':'#ff8a8a';ctx.font='bold 36px Segoe UI, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(r.success?'✅ Місію виконано!':'❌ Місію провалено',W/2,H/2);ctx.textBaseline='alphabetic';
   }
   var want=Math.floor(t*(steps.length+1)*1.05);
   while(shown<steps.length&&shown<want){
    var L=steps[shown],ic=L.t==='ok'?'✅':L.t==='warn'?'⚠️':'❌';
    var sec=Math.round(3+shown*7+Math.random()*4);
    var d=h('div',null,esc('00:'+String(sec).padStart(2,'0')+' '+ic+' '+L.msg.split(':')[0]));
    log.appendChild(d);shown++;
   }
   if(t<1)raf=requestAnimationFrame(frame);else setTimeout(onEnd,900);
  }
  raf=requestAnimationFrame(frame);
  return function(){cancelAnimationFrame(raf);};
 }

 function groundY(H,m,b){
  if(m.theme==='reef')return H*0.62;
  if(m.theme==='tank')return H*0.8;
  return H*0.74;
 }
 function drawScene(c,W,H,th,now){

   c.fillStyle='#d6dee8';c.fillRect(0,0,W,H);

   c.fillStyle='#9aa3ad';c.fillRect(0,gy,W,H-gy);
   c.strokeStyle='#f2b705';c.lineWidth=6;c.setLineDash([30,16]);c.beginPath();c.moveTo(0,gy+30);c.lineTo(W,gy+30);c.stroke();c.setLineDash([]);

   c.fillStyle='#5f9e3c';c.beginPath();c.moveTo(0,gy);for(i=0;i<=20;i++)c.lineTo(i*W/20,gy+Math.sin(i*1.7)*6);c.lineTo(W,H);c.lineTo(0,H);c.fill();
   var fl=[150,330,520,610,800,900];fl.forEach(function(fx){c.strokeStyle='#333';c.lineWidth=2;c.beginPath();c.moveTo(fx,gy+4);c.lineTo(fx,gy-30);c.stroke();c.fillStyle='#d83b3b';c.beginPath();c.moveTo(fx,gy-30);c.lineTo(fx+20,gy-24);c.lineTo(fx,gy-18);c.fill();});
   c.fillStyle='#d83b3b';c.fillRect(30,40,150,40);c.fillStyle='#fff';c.font='bold 20px Segoe UI, sans-serif';c.fillText('⚠ МІНИ',58,67);
  }else if(th==='rubble'){
   c.fillStyle='#24262c';c.fillRect(0,0,W,H);

   for(i=0;i<12;i++){c.save();c.translate(40+i*85,gy+5);c.rotate((i%4-1.5)*0.18);c.fillRect(-45,-25-(i%3)*10,90,35);c.restore();}
   c.fillStyle='#3a3c43';c.fillRect(0,gy+20,W,H-gy);
   c.fillStyle='rgba(200,200,200,.18)';for(i=0;i<60;i++){var dx=(i*137+now/30)%W,dy=(i*53)%gy;c.fillRect(dx,dy,2,2);}
  }else if(th==='reef'){
   g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a7bb0');g.addColorStop(1,'#062f4a');c.fillStyle=g;c.fillRect(0,0,W,H);
   c.fillStyle='#b9a26a';c.beginPath();c.moveTo(0,H*0.82);for(i=0;i<=10;i++)c.lineTo(i*W/10,H*0.82+Math.sin(i)*8);c.lineTo(W,H);c.lineTo(0,H);c.fill();
   var cols=['#ff7b9c','#ffa94d','#e599f7','#ff6b6b'];

 function drawRobot(c,x,m,b,now,stuck){
  var H=c.canvas.height,gy=groundY(H,m,b),ch=b.chassis,y=gy,spin=stuck?0:now/90;
  if(ch==='drone')y=gy-80+Math.sin(now/300)*6;
  if(ch==='rov'&&m.theme!=='reef')y=gy;
  if(m.theme==='reef'&&ch!=='rov')y=H*0.82;
  if(b.power==='tether'){c.strokeStyle='#222';c.lineWidth=3;c.beginPath();c.moveTo(0,y-20);c.quadraticCurveTo(x/2,y+10,x-30,y-18);c.stroke();}
  var body=ch==='rov'?'#f2b705':'#1976d2';
  if(ch==='snake'){
   for(var i=6;i>=0;i--){var sx=x-i*16,sy=y-10+Math.sin(now/150+i)*6;c.fillStyle=i===0?'#0d47a1':'#1976d2';c.beginPath();c.arc(sx,sy,10,0,7);c.fill();}
   drawSensors(c,x+6,y-16,b);return;
  }
  if(ch==='drone'){
   c.fillStyle='#333';c.fillRect(x-40,y-4,80,4);
   c.fillStyle=body;c.fillRect(x-18,y-12,36,18);
   [-40,40].forEach(function(o){c.fillStyle='rgba(60,60,60,.6)';c.beginPath();c.ellipse(x+o,y-8,22*Math.abs(Math.cos(spin*3)),3,0,0,7);c.fill();});
   drawSensors(c,x+14,y,b);return;
  }
  if(ch==='rov'){
   c.fillStyle=body;c.fillRect(x-34,y-36,68,30);c.fillStyle='#333';c.fillRect(x-42,y-28,8,14);c.fillRect(x+34,y-28,8,14);
   c.fillStyle='rgba(255,255,180,.25)';c.beginPath();c.moveTo(x+34,y-24);c.lineTo(x+160,y-60);c.lineTo(x+160,y+10);c.fill();
   drawSensors(c,x+28,y-36,b);return;
  }
  var by=y-(ch==='legs'?46:30);
  c.fillStyle=body;c.fillRect(x-32,by-22,64,24);
  if(b.power==='solar'){c.fillStyle='#1b3a6b';c.fillRect(x-36,by-30,72,6);}
  c.fillStyle='#222';
  if(ch==='wheels2'){wheel(c,x-14,y-11,11,spin);c.beginPath();c.arc(x+24,y-5,5,0,7);c.fill();}
  else if(ch==='wheels4'||ch==='magnetic'){wheel(c,x-20,y-11,11,spin);wheel(c,x+20,y-11,11,spin);
   if(ch==='magnetic'){c.fillStyle='#d83b3b';c.fillRect(x-24,y-4,8,4);c.fillRect(x+16,y-4,8,4);}}

  else if(ch==='legs'){c.strokeStyle='#222';c.lineWidth=4;for(var l=0;l<3;l++){var lx=x-22+l*22,ph=Math.sin(spin*0.6+l*2)*8;c.beginPath();c.moveTo(lx,by+2);c.lineTo(lx+ph,by+14);c.lineTo(lx+ph*0.5,y);c.stroke();}}
  else{c.fillStyle='#555';c.fillRect(x-30,y-10,60,10);}

 function drawMap(cv,map,f,trail,cs){
  var c=cv.getContext('2d'),g=map.grid,th=cur.theme;
  var floor=th==='mars'?'#c8734f':th==='mines'?'#6aa84f':'#cfd7e1',wall=th==='mars'?'#5e2614':th==='mines'?'#2f5a22':'#8a6d4a';
  for(var y=0;y<g.length;y++)for(var x=0;x<g[0].length;x++){
   var ch=g[y][x];
   c.fillStyle=ch==='#'?wall:floor;c.fillRect(x*cs,y*cs,cs,cs);
   c.strokeStyle='rgba(0,0,0,.15)';c.lineWidth=1;c.strokeRect(x*cs+0.5,y*cs+0.5,cs-1,cs-1);
   if(ch==='#'&&th==='warehouse'){c.fillStyle='#c9a46b';c.fillRect(x*cs+6,y*cs+6,cs-12,cs/2-8);c.fillRect(x*cs+6,y*cs+cs/2+2,cs-12,cs/2-8);}
   if(ch==='#'&&th==='mars'){c.fillStyle='#7a3520';c.beginPath();c.arc(x*cs+cs/2,y*cs+cs/2,cs*0.32,0,7);c.fill();}
   if(ch==='R'){c.fillStyle='#d83b3b';c.fillRect(x*cs+3,y*cs+3,cs-6,cs-6);}
   if(ch==='M'&&!map.hidden){c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.arc(x*cs+cs/2,y*cs+cs/2,cs*0.22,0,7);c.fill();c.fillStyle='#fff';c.font='bold '+Math.round(cs*0.3)+'px Segoe UI';c.textAlign='center';c.textBaseline='middle';c.fillText('?',x*cs+cs/2,y*cs+cs/2+1);}
  }
  if(th==='warehouse'){c.strokeStyle='#f2b705';c.lineWidth=5;c.beginPath();c.moveTo(map.start[0]*cs+cs/2,map.start[1]*cs+cs/2);c.lineTo(cs/2,2*cs+cs/2);c.lineTo(4*cs+cs/2,2*cs+cs/2);c.stroke();}
  c.fillStyle='rgba(25,118,210,.35)';trail.forEach(function(p){c.beginPath();c.arc(p[0]*cs+cs/2,p[1]*cs+cs/2,cs*0.1,0,7);c.fill();});
  c.font=Math.round(cs*0.42)+'px Segoe UI Emoji, sans-serif';c.textAlign='center';c.textBaseline='middle';
  Object.keys(f.marks).forEach(function(k){var p=k.split(',');c.fillText('🚩',p[0]*cs+cs*0.72,p[1]*cs+cs*0.3);});
  var cx=f.x*cs+cs/2,cy=f.y*cs+cs/2,r=cs*0.34;
  c.fillStyle='#1976d2';c.beginPath();c.arc(cx,cy,r,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();
  var a=[-Math.PI/2,0,Math.PI/2,Math.PI][f.d];
  c.fillStyle='#fff';c.beginPath();c.moveTo(cx+Math.cos(a)*r*0.8,cy+Math.sin(a)*r*0.8);c.lineTo(cx+Math.cos(a+2.4)*r*0.55,cy+Math.sin(a+2.4)*r*0.55);c.lineTo(cx+Math.cos(a-2.4)*r*0.55,cy+Math.sin(a-2.4)*r*0.55);c.fill();
  if(f.ev==='crash'){var nx=cx+[0,1,0,-1][f.d]*cs*0.5,ny=cy+[-1,0,1,0][f.d]*cs*0.5;c.fillText('💥',nx,ny);}
  if(f.ev==='drift')c.fillText('🌀',cx,cy-cs*0.55);
 }

  app.appendChild(c);
  var t=h('section','card');
  var rows=MISSIONS.map(function(m){var s=mstate(m.id);return '<tr><td>'+m.icon+' '+m.title+'</td><td style="color:#f2b705;font-size:18px">'+starsStr(s.stars)+'</td><td style="color:#f2b705;font-size:18px">'+(m.prog?starsStr(s.pStars):'—')+'</td><td>'+(s.pts+s.pPts)+'</td></tr>';}).join('');
  t.innerHTML='<h2>По місіях</h2><table><tr><th>Місія</th><th>🔧 Робот</th><th>💻 Програма</th><th>Очки</th></tr>'+rows+'</table>';
  app.appendChild(t);
  var a=h('section','row');
  var mb=h('button','btn','🗺️ До місій');mb.onclick=showMap;a.appendChild(mb);
  var rs=h('button','btn ghost','Почати заново');var arm=false;
  rs.onclick=function(){if(!arm){arm=true;rs.textContent='Точно? Увесь прогрес зітреться — натисни ще раз';return;}try{localStorage.removeItem(KEY);}catch(e){}S=null;showStart();};
  a.appendChild(rs);app.appendChild(a);
 }

 /* ---------- тема ---------- */
 (function(){
  var root=document.documentElement,tb=document.getElementById('themeBtn');
  function isDark(){var t=root.getAttribute('data-theme');if(t)return t==='dark';return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;}
  function syncIcon(){tb.textContent=isDark()?'☀️':'🌙';}
  tb.onclick=function(){var n=isDark()?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('vexTheme',n);}catch(e){}syncIcon();};
  syncIcon();
 })();

 if(S)showMap();else showStart();
})();
</script>
